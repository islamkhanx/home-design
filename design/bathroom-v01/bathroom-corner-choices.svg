<text x="1465" y="984" font-size="21" font-weight="400" fill="#354943">Профиль закрывает кромки</text>
<text x="1465" y="1026" font-size="21" font-weight="400" fill="#354943">Монтажная полка под плиткой</text>
<text x="1465" y="1068" font-size="21" font-weight="400" fill="#354943">Форма зависит от изделия</text>
<text x="1075" y="1193" font-size="22" font-weight="700" fill="#354943">Вид: аккуратный графичный кант</text>
<text x="1075" y="1230" font-size="22" font-weight="400" fill="#354943">Монтаж: прямые резы плитки; точная посадка профиля</text>
<text x="1075" y="1267" font-size="22" font-weight="400" fill="#354943">Стойкость: профиль защищает края от ударов</text>
<path d="M50.00 1320.00 L1950.00 1320.00" fill="none" stroke="#cdd2c8" stroke-width="1.2" stroke-dasharray=""/>
<text x="50" y="1370" font-size="28" font-weight="700" fill="#354943">ГДЕ ЭТО В НАШЕЙ A3</text>
<rect x="80.0" y="1410.0" width="49.5" height="66.0" fill="#c4a57a" stroke="#354943" stroke-width="1" rx="0"/>
<rect x="80.0" y="1484.8" width="22.0" height="75.9" fill="#ded8cb" stroke="#354943" stroke-width="1" rx="0"/>
