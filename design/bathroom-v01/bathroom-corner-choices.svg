<text x="475" y="984" font-size="21" font-weight="400" fill="#354943">Запил с обратной стороны</text>
<text x="475" y="1026" font-size="21" font-weight="400" fill="#354943">Торцы сходятся под 45°</text>
<text x="475" y="1068" font-size="21" font-weight="400" fill="#354943">Кромку не сводят «в нож»</text>
<text x="85" y="1193" font-size="22" font-weight="700" fill="#354943">Вид: цельный каменный объём</text>
<text x="85" y="1230" font-size="22" font-weight="400" fill="#354943">Монтаж: точный рез и обработка обеих кромок</text>
<text x="85" y="1267" font-size="22" font-weight="400" fill="#354943">Стойкость: тонкий край требует бережного обращения</text>
<text x="1060" y="220" font-size="29" font-weight="700" fill="#354943">У2 · ПРЯМОЙ МЕТАЛЛИЧЕСКИЙ ПРОФИЛЬ</text>
<path d="M1220.00 335.00 L1490.00 230.00 L1760.00 335.00 L1490.00 440.00 L1220.00 335.00" fill="#e6dfd1" stroke="#827b6d" stroke-width="1" stroke-dasharray=""/>
