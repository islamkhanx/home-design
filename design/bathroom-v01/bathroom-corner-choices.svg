<text x="1075" y="827" font-size="25" font-weight="700" fill="#354943">На углу видна ровная металлическая линия</text>
<text x="1075" y="869" font-size="22" font-weight="400" fill="#354943">Сечение сверху · принцип соединения</text>
<rect x="1155" y="955" width="190" height="190" fill="#cbd0c8" stroke="none" stroke-width="1" rx="0"/>
