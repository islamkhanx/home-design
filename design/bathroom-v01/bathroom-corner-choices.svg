<path d="M80.00 1405.00 L80.00 1570.00" fill="none" stroke="#354943" stroke-width="3" stroke-dasharray=""/>
<path d="M102.00 1484.80 L102.00 1560.70" fill="none" stroke="#b67843" stroke-width="5" stroke-dasharray=""/>
<path d="M80.00 1484.80 L102.00 1484.80" fill="none" stroke="#b67843" stroke-width="5" stroke-dasharray=""/>
<text x="195" y="1443" font-size="20" font-weight="400" fill="#354943">Тумба</text>
<text x="195" y="1513" font-size="20" font-weight="400" fill="#354943">WC</text>
<text x="360" y="1436" font-size="24" font-weight="700" fill="#354943">Выделен доступный наружный угол короба WC рядом с тумбой.</text>
<text x="360" y="1479" font-size="22" font-weight="400" fill="#354943">Здесь сравниваем вертикальную кромку и верхнее переднее ребро короба.</text>
<text x="360" y="1522" font-size="22" font-weight="400" fill="#354943">Остальные торцы и углы шахты уточним после обмеров и проверки доступа.</text>
<text x="360" y="1578" font-size="22" font-weight="700" fill="#354943">У ванны и на внутренних примыканиях нужен отдельный узел:</text>
<text x="360" y="1612" font-size="22" font-weight="400" fill="#354943">эпоксидная затирка не заменяет предусмотренные эластичные швы.</text>
<text x="50" y="1691" font-size="20" font-weight="400" fill="#354943">На рисунке У2 — условный прямой профиль. Материал, отделка и высота подбираются под плитку и условия эксплуатации.</text>
<text x="50" y="1732" font-size="20" font-weight="400" fill="#6b766f">Основание: рекомендации RUBI по заусовке и Schlüter по защите кромок. Ни один вариант пока не выбран.</text>
</svg>