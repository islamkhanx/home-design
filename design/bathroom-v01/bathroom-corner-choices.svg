<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1780" viewBox="0 0 2000 1780">
<rect x="0" y="0" width="2000" height="1780" fill="#f5f3ee" stroke="none" stroke-width="1" rx="0"/>
<text x="50" y="64" font-size="37" font-weight="700" fill="#354943">A3 / M1 / T1 · КАК ОФОРМИТЬ НАРУЖНЫЙ УГОЛ</text>
<text x="50" y="107" font-size="23" font-weight="400" fill="#354943">Одинаковый светлый камень. Слева — стык двух запиленных плит; справа — защитная металлическая кромка.</text>
<text x="50" y="148" font-size="21" font-weight="400" fill="#7b786b">Схематичные крупные планы: толщины и ширины увеличены для наглядности. Это не монтажные чертежи.</text>
<text x="70" y="220" font-size="29" font-weight="700" fill="#354943">У1 · ЗАПИЛ 45°</text>
<path d="M230.00 335.00 L500.00 230.00 L770.00 335.00 L500.00 440.00 L230.00 335.00" fill="#e6dfd1" stroke="#827b6d" stroke-width="1" stroke-dasharray=""/>
