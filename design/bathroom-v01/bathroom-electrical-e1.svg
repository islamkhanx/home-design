<text x="55" y="538.55" font-size="18" font-weight="700" fill="#9c642f">730*</text>
<text x="55" y="960" font-size="20" font-weight="400" fill="#354943">730* — от борта ванны до центра R2 в модели.</text>
<text x="55" y="991" font-size="20" font-weight="400" fill="#9c642f">Это не подтверждение допустимой электрической зоны.</text>
<text x="55" y="1022" font-size="20" font-weight="400" fill="#354943">V? — место вытяжки уточняется по реальному вентканалу.</text>
<text x="810" y="225" font-size="26" font-weight="700" fill="#354943">ТОЧКИ · ВЫСОТЫ ОТ ЧИСТОВОГО ПОЛА</text>
<rect x="800" y="252" width="1135" height="121" fill="#ffffff" stroke="#e0e1d9" stroke-width="1" rx="6"/>
<text x="820" y="279" font-size="24" font-weight="700" fill="#354943">R1</text>
<text x="945" y="279" font-size="23" font-weight="700" fill="#354943">Стиральная машина · 1 розетка</text>
<text x="820" y="318" font-size="22" font-weight="400" fill="#354943">В доступном отсеке колонны; ориентир 1100–1300 мм.</text>
<text x="820" y="351" font-size="21" font-weight="400" fill="#61726a">Проверить длину штатного шнура и доступ к вилке.</text>
<rect x="800" y="391" width="1135" height="121" fill="#ffffff" stroke="#e0e1d9" stroke-width="1" rx="6"/>
<text x="820" y="418" font-size="24" font-weight="700" fill="#354943">R2</text>
<text x="945" y="418" font-size="23" font-weight="700" fill="#354943">Фен / зарядка · блок из 2 розеток</text>
<text x="820" y="457" font-size="22" font-weight="400" fill="#354943">На левой стене у дальнего от ванны края тумбы.</text>
<text x="820" y="490" font-size="21" font-weight="400" fill="#61726a">Ориентир 1100–1200 мм; проверить рамку и мокрые зоны.</text>
<rect x="800" y="530" width="1135" height="121" fill="#ffffff" stroke="#e0e1d9" stroke-width="1" rx="6"/>
<text x="820" y="557" font-size="24" font-weight="700" fill="#354943">G2 / D</text>
<text x="945" y="557" font-size="23" font-weight="700" fill="#354943">Зеркало · вывод + доступный блок питания</text>
<text x="820" y="596" font-size="22" font-weight="400" fill="#354943">К зеркалу — вывод по выбранной системе подсветки.</text>
<text x="820" y="629" font-size="21" font-weight="400" fill="#61726a">D: отдельный отсек колонны; доступ и охлаждение.</text>
<rect x="800" y="669" width="1135" height="121" fill="#ffffff" stroke="#e0e1d9" stroke-width="1" rx="6"/>
<text x="820" y="696" font-size="24" font-weight="700" fill="#354943">V?</text>
<text x="945" y="696" font-size="23" font-weight="700" fill="#354943">Вытяжка · 1 вывод, место пока не назначено</text>
<text x="820" y="735" font-size="22" font-weight="400" fill="#354943">У фактического вентканала; схема по модели вентилятора.</text>
<text x="820" y="768" font-size="21" font-weight="400" fill="#61726a">Предлагаю отдельную команду и выбег по таймеру.</text>
<rect x="800" y="808" width="1135" height="121" fill="#ffffff" stroke="#e0e1d9" stroke-width="1" rx="6"/>
<text x="820" y="835" font-size="24" font-weight="700" fill="#354943">S</text>
<text x="945" y="835" font-size="23" font-weight="700" fill="#354943">Управление снаружи санузла · около 1000 мм</text>
<text x="820" y="874" font-size="22" font-weight="400" fill="#354943">Общий свет / зеркало с диммированием / вытяжка.</text>
<text x="820" y="907" font-size="21" font-weight="400" fill="#61726a">Точное число клавиш — после выбора оборудования.</text>
<text x="810" y="1015" font-size="22" font-weight="700" fill="#354943">СВЕТ: 2 потолочные точки G1 + 2 линии зеркала G2.</text>
<text x="810" y="1049" font-size="21" font-weight="400" fill="#354943">Обычный: G1 + G2 · уборка: оба ярко · вечер: только G2.</text>
<rect x="50" y="1080" width="1900" height="265" fill="#e8ede6" stroke="none" stroke-width="1" rx="8"/>
<text x="75" y="1120" font-size="25" font-weight="700" fill="#354943">ЧТО ПРЕДУСМОТРЕТЬ В ПРОЕКТЕ ЭЛЕКТРИКИ</text>
<text x="75" y="1160" font-size="22" font-weight="400" fill="#354943">Линия стиралки отдельно; розетки и освещение разделить. Сечения и защиту назначает электрик по расчёту.</text>
<text x="75" y="1196" font-size="22" font-weight="400" fill="#354943">Розетки: защитный контакт PE и дифференциальная защита до 30 мА; размещение и IP — по зонам санузла.</text>
<text x="75" y="1232" font-size="22" font-weight="400" fill="#354943">Трассы: потолок → вертикальные спуски. Новые штробы зависят от существующей проводки и материала стен.</text>
<text x="75" y="1268" font-size="22" font-weight="400" fill="#354943">Для обсуждения: электрический полотенцесушитель, защита от протечек, бойлер. Их точек на плане пока нет.</text>
<text x="75" y="1307" font-size="21" font-weight="400" fill="#61726a">Схема для выбора удобства. Монтаж, проверку PE, защитных устройств и уравнивания потенциалов — электрику.</text>
<text x="50" y="1380" font-size="20" font-weight="400" fill="#61726a">Э1 · 13.11.2026 · Не утверждено · Габариты мебели и оборудования уточнить по обмерам и паспортам.</text>
</svg>