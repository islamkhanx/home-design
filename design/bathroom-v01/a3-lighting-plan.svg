<text x="50" y="60" font-size="38" font-weight="700" fill="#354943">A3 / СВЕТ И ТОЧКИ ПИТАНИЯ</text>
<text x="50" y="102" font-size="24" font-weight="400" fill="#354943">Концептуальная схема: группы и места потребителей. Не план для электромонтажа.</text>
<rect x="50" y="125" width="1900" height="45" fill="#eee2c7" stroke="none" stroke-width="1" rx="0"/>
<text x="66" y="156" font-size="21" font-weight="400" fill="#795c33">Расположение розеток, IP, защита линий и кабели — после обмеров и проверки применимых электрических зон.</text>
