<text x="333.0" y="214" font-size="18" font-weight="400" fill="#354943">1800*</text>
<text x="65" y="960" font-size="21" font-weight="400" fill="#354943">* 1800 × 2470 мм — условный контур.</text>
<text x="65" y="993" font-size="21" font-weight="400" fill="#354943">Высоты розеток пока не назначены.</text>
<text x="800" y="225" font-size="27" font-weight="700" fill="#354943">2 ГРУППЫ / 4 ИСТОЧНИКА</text>
<rect x="800" y="250" width="62" height="39" fill="#354943" stroke="none" stroke-width="1" rx="4"/>
<text x="812" y="277" font-size="22" font-weight="700" fill="#ffffff">G1</text>
<text x="880" y="275" font-size="23" font-weight="700" fill="#354943">2 потолочные точки</text>
<text x="880" y="308" font-size="21" font-weight="400" fill="#354943">Общий свет: вход, уборка, пользование санузлом.</text>
<rect x="800" y="341" width="62" height="39" fill="#354943" stroke="none" stroke-width="1" rx="4"/>
<text x="812" y="368" font-size="22" font-weight="700" fill="#ffffff">G2</text>
<text x="880" y="366" font-size="23" font-weight="700" fill="#354943">2 вертикальные линии у зеркала</text>
<text x="880" y="399" font-size="21" font-weight="400" fill="#354943">Отдельное включение и регулировка яркости.</text>
<text x="800" y="585" font-size="27" font-weight="700" fill="#354943">ПИТАНИЕ И УПРАВЛЕНИЕ</text>
<text x="800" y="632" font-size="24" font-weight="700" fill="#354943">R1</text>
<text x="865" y="632" font-size="22" font-weight="400" fill="#354943">1 розетка СМ — в доступном отсеке колонны.</text>
<text x="800" y="692" font-size="24" font-weight="700" fill="#354943">R2</text>
<text x="865" y="692" font-size="22" font-weight="400" fill="#354943">Блок из 2 розеток у тумбы — кандидат, проверить зоны.</text>
<text x="800" y="752" font-size="24" font-weight="700" fill="#354943">D</text>
<text x="865" y="752" font-size="22" font-weight="400" fill="#354943">Место под драйверы G2 в верхнем отсеке колонны.</text>
<text x="800" y="812" font-size="24" font-weight="700" fill="#354943">S</text>
<text x="865" y="812" font-size="22" font-weight="400" fill="#354943">Управление 2 группами снаружи, со стороны коридора.</text>
<text x="800" y="904" font-size="23" font-weight="700" fill="#354943">Доступ к драйверам — через дверцу шкафа.</text>
<text x="800" y="941" font-size="21" font-weight="400" fill="#354943">Количество, мощность и охлаждение — по выбранным светильникам.</text>
<text x="800" y="978" font-size="21" font-weight="400" fill="#354943">Предварительная трасса: потолок → отдельные спуски к точкам.</text>
<text x="50" y="1052" font-size="22" font-weight="400" fill="#795c33">Вытяжка, полотенцесушитель и возможный бойлер: питание добавим после выбора их расположения.</text>
</svg>