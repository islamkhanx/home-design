<text x="1090" y="1045" font-family="Arial" font-size="21" font-weight="700" fill="#243642">Тёплый камень + светлое дерево + белая сантехника.</text>
<text x="1090" y="1084" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Ванна 1700 × 700. Подвесная тумба 600 × 450.</text>
<text x="1090" y="1122" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Узкая стиралка: ориентир корпуса 600 × 450 × 850.</text>
<text x="1090" y="1160" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Монтажный резерв стиралки: 650 × 550.</text>
<text x="1090" y="1198" font-family="Arial" font-size="20" font-weight="400" fill="#946824">Короб и толщину обшивки инсталляции уточнить обмером.</text>
<text x="60" y="1296" font-family="Arial" font-size="22" font-weight="700" fill="#243642">1  Ванна</text>
<text x="310" y="1296" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Съёмный экран или люк к сифону; торцевая доборная зона условно 100.</text>
<text x="60" y="1341" font-family="Arial" font-size="22" font-weight="700" fill="#243642">2  Раковина</text>
<text x="310" y="1341" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Тумба подвесная; верх раковины ориентировочно 850 от чистого пола.</text>
<text x="60" y="1386" font-family="Arial" font-size="22" font-weight="700" fill="#243642">3  Унитаз</text>
<text x="310" y="1386" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Инсталляция в облицованном коробе; суммарный вылет в модели 720.</text>
<text x="60" y="1431" font-family="Arial" font-size="22" font-weight="700" fill="#243642">4  Стирка</text>
<text x="310" y="1431" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Шкаф над машиной глубиной 300; доступ к вентилю и розетке сбоку.</text>
<text x="60" y="1476" font-family="Arial" font-size="22" font-weight="700" fill="#243642">5  Коммуникации</text>
<text x="310" y="1476" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Сохраняем резерв под исходный сантехкороб; размеры и ревизия неизвестны.</text>
<text x="60" y="1530" font-family="Arial" font-size="20" font-weight="400" fill="#657780">Высота и линейные размеры условны. Масштаб на экране меняется; ориентироваться на числовые размеры.</text>
</svg>