<text x="727" y="590" font-family="Arial" font-size="24" font-weight="700" fill="#243642">ВХОД</text>
<text x="727" y="623" font-family="Arial" font-size="19" font-weight="400" fill="#243642">проём 900*</text>
<text x="727" y="660" font-family="Arial" font-size="19" font-weight="400" fill="#243642">открывание</text>
<text x="727" y="687" font-family="Arial" font-size="19" font-weight="400" fill="#243642">в коридор</text>
<text x="78" y="1136" font-family="Arial" font-size="21" font-weight="400" fill="#243642">Пунктир: зоны пользования, а не предметы мебели.</text>
<text x="78" y="1171" font-family="Arial" font-size="21" font-weight="700" fill="#946824">Зоны перед унитазом и стиралкой пересекаются.</text>
<text x="78" y="1205" font-family="Arial" font-size="20" font-weight="400" fill="#946824">Открытый люк и удобство прохода нужно проверить вживую.</text>
