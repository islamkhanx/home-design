<rect x="170.0" y="610.0" width="104.0" height="72.0" fill="#fff" stroke="#6d7a80" stroke-width="1.5" rx="22"/>
<rect x="360.0" y="684.0" width="130.0" height="110.0" fill="#d9e2e7" stroke="#66818f" stroke-width="1.4" rx="0"/>
