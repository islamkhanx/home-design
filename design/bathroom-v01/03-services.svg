<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1660" viewBox="0 0 2000 1660">
<rect x="0" y="0" width="2000" height="1660" fill="#f3f4f1" stroke="none" stroke-width="1" rx="0"/>
<text x="50" y="59" font-family="Arial" font-size="40" font-weight="700" fill="#243642">Санузел · свет и инженерные точки</text>
<text x="50" y="98" font-family="Arial" font-size="23" font-weight="400" fill="#243642">03 / 03 · точки потребления и сценарии · маршруты кабелей, трубы и зоны безопасности ещё не утверждены</text>
<rect x="50" y="120" width="1900" height="43" fill="#fff0d3" stroke="none" stroke-width="1" rx="0"/>
<text x="66" y="149" font-family="Arial" font-size="22" font-weight="700" fill="#805b25">Размеры предложены для проверки: помещение 1800 × 2470, высота 2700. Это НЕ обмер и НЕ монтажный проект.</text>
<rect x="50" y="190" width="750" height="980" fill="#fff" stroke="#dce1e2" stroke-width="1" rx="0"/>
<text x="75" y="230" font-family="Arial" font-size="28" font-weight="700" fill="#243642">План точек</text>
<text x="75" y="263" font-family="Arial" font-size="19" font-weight="400" fill="#64747d">Начало координат: левый верхний угол у ванны.</text>
<rect x="830" y="190" width="1120" height="980" fill="#fff" stroke="#dce1e2" stroke-width="1" rx="0"/>
<text x="855" y="230" font-family="Arial" font-size="28" font-weight="700" fill="#243642">Что подключаем</text>
<text x="855" y="263" font-family="Arial" font-size="19" font-weight="400" fill="#64747d">X — от левой стены; Y — от стены ванны; Z — от чистого пола.</text>
<rect x="130.0" y="300.0" width="360.0" height="494.0" fill="#efede7" stroke="#6d7a80" stroke-width="1" rx="0"/>
