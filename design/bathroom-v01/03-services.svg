<rect x="130.0" y="460.0" width="90.0" height="120.0" fill="#cfb893" stroke="#6d7a80" stroke-width="1" rx="0"/>
<rect x="140.0" y="473.0" width="68.0" height="93.0" fill="#fff" stroke="#84959d" stroke-width="1" rx="10"/>
